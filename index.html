<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeremy Giffon</title>
<meta name="description" content="Jeremy Giffon is the founder of Octave. We buy and build venture-backed technology companies into great long-term businesses.">
<link rel="canonical" href="https://jeremygiffon.com/">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta property="og:title" content="Jeremy Giffon">
<meta property="og:description" content="Founder of Octave. We buy and build venture-backed technology companies into great long-term businesses.">
<meta property="og:url" content="https://jeremygiffon.com/">
<meta property="og:type" content="website">
<style>
  @font-face {
    font-family: "Spezia Serif";
    src: url("fonts/SpeziaSerif-Medium.otf") format("opentype");
    font-weight: 500;
    font-display: swap;
  }
  @font-face {
    font-family: "Spezia Wide";
    src: url("fonts/SpeziaWide-Medium.otf") format("opentype");
    font-weight: 500;
    font-display: swap;
  }
  @font-face {
    font-family: "ABCO Benedict";
    src: url("fonts/ABCOBenedict-Regular.ttf") format("truetype");
    font-weight: 400;
    font-display: swap;
  }

  :root {
    --paper: #F4F3EF;
    --white: #F9F9F9;
    --ink: #121212;
    --purple: #3B0558;
    --terracotta: #914937;
    --rule: rgba(18, 18, 18, 0.14);
    --muted: rgba(18, 18, 18, 0.56);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Spezia Wide", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    letter-spacing: 0.014em;
    line-height: 1.45;
    font-size: 15px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  a {
    color: var(--purple);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    text-decoration-color: rgba(59, 5, 88, 0.35);
    transition: color 120ms ease, text-decoration-color 120ms ease;
  }
  a:hover {
    color: var(--terracotta);
    text-decoration-color: rgba(145, 73, 55, 0.5);
  }

  /* ---- Poster grid ---- */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
    align-items: center;
    gap: clamp(32px, 5vw, 96px);
    width: 100%;
    max-width: 1360px;
    margin: 0 auto;
    padding: clamp(24px, 3.5vh, 48px) clamp(24px, 4vw, 72px) 16px;
  }

  /* ---- Left: content ---- */
  h1 {
    font-family: "Spezia Serif", Georgia, serif;
    font-weight: 500;
    font-size: clamp(2.3rem, 3.6vw, 3.1rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .points {
    list-style: none;
    margin-top: 26px;
    max-width: 30em;
  }

  .points li {
    position: relative;
    font-family: "Spezia Serif", Georgia, serif;
    font-size: 1.2rem;
    line-height: 1.45;
    padding-left: 26px;
    margin-top: 14px;
  }

  .points li::before {
    content: "\00B7";
    position: absolute;
    left: 4px;
    color: var(--terracotta);
  }

  .points a { text-decoration-color: rgba(59, 5, 88, 0.28); }

  /* Show only the input + button row of the Substack embed:
     the form row sits at the vertical center of the iframe, so a
     short overflow-hidden window cropped to the middle hides the
     title, subscriber count, and legal text around it. */
  .embed {
    position: relative;
    max-width: 440px;
    height: 60px;
    overflow: hidden;
    margin-top: 30px;
  }
  .embed iframe {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: calc(100% + 24px);
    height: 320px;
    border: 0;
  }

  /* ---- Right: etching plate ---- */
  .plate {
    align-self: center;
    text-align: center;
  }
  .plate img.etching {
    display: block;
    width: min(100%, calc(92vh * 1210 / 1600));
    height: auto;
    aspect-ratio: 1210 / 1600;
    margin: 0 auto;
    /* crop off the white plate mat baked into the PNG */
    clip-path: polygon(22.08% 3.09%, 77.92% 3.09%, 95.91% 16.22%, 95.91% 83.78%, 77.92% 96.91%, 22.08% 96.91%, 4.09% 83.78%, 4.09% 16.22%);
  }
  /* ---- Narrow screens ---- */
  @media (max-width: 900px) {
    body { font-size: 16px; }
    main {
      grid-template-columns: 1fr;
      align-items: start;
      padding-top: 56px;
    }
    .plate { order: -1; padding: 0 0 8px; }
    .plate img.etching { max-width: min(420px, 82vw); max-height: none; }
  }
</style>
</head>
<body>
<main>
  <div class="content">
    <header>
      <h1>Jeremy Giffon</h1>
    </header>

    <ul class="points">
      <li>I invest in unconventional technology companies through my <a href="https://octavecap.com">fund</a></li>
      <li>I write on <a href="https://x.com/jeremygiffon">X</a> and <a href="https://jeremygiffon.substack.com">Substack</a></li>
      <li>I&rsquo;ve done interviews on <a href="https://colossus.com/episode/giffon-special-situations-in-private-markets/">Invest Like The Best</a>, <a href="https://www.mfmpod.com/we-turned-5m-into-419m-buying-cashflow-businesses-ft-jeremy-giffon/">My First Million</a>, and <a href="https://share.snipd.com/person/jeremy-giffon/hQgumP6WRvyAX_NOfmWx5A">more</a></li>
      <li>My resume is on <a href="https://www.linkedin.com/in/jeremygiffon/">LinkedIn</a></li>
    </ul>

    <div class="embed" aria-label="Subscribe to my Substack">
      <iframe src="https://jeremygiffon.substack.com/embed" title="Subscribe to Jeremy Giffon's newsletter" scrolling="no"></iframe>
    </div>
  </div>

  <aside class="plate" aria-hidden="true">
    <img class="etching" id="etching" alt="">
    <noscript><img class="etching" src="assets/etching-garden-1.png" alt=""></noscript>
  </aside>
</main>
<script>
  (function () {
    var etchings = ["cathedral-1", "cathedral-2", "cathedral-3", "garden-1", "garden-2", "garden-3"];
    var last = null;
    try { last = localStorage.getItem("etching"); } catch (e) {}
    var pool = etchings.filter(function (e) { return e !== last; });
    var pick = pool[Math.floor(Math.random() * pool.length)];
    try { localStorage.setItem("etching", pick); } catch (e) {}
    document.getElementById("etching").src = "assets/etching-" + pick + ".png";
  })();
</script>
</body>
</html>
