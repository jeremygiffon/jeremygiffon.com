<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Jeremy Giffon",
  "url": "https://jeremygiffon.com/",
  "jobTitle": "Founder",
  "worksFor": {
    "@type": "Organization",
    "name": "Octave",
    "url": "https://octavecap.com"
  },
  "sameAs": [
    "https://x.com/jeremygiffon",
    "https://www.linkedin.com/in/jeremygiffon/",
    "https://jeremygiffon.substack.com"
  ]
}
</script>
<style>
  @font-face {
    font-family: "Spezia Serif";
    src: url("fonts/SpeziaSerif-Medium.otf") format("opentype");
    font-weight: 500;
    font-display: swap;
  }
  @font-face {
    font-family: "Spezia Wide";
    src: url("fonts/SpeziaWide-Medium.otf") format("opentype");
    font-weight: 500;
    font-display: swap;
  }
  @font-face {
    font-family: "ABCO Benedict";
    src: url("fonts/ABCOBenedict-Regular.ttf") format("truetype");
    font-weight: 400;
    font-display: swap;
  }

  :root {
    --h1size: clamp(2.3rem, 3.6vw, 3.1rem);
    --paper: #F4F3EF;
    --white: #F9F9F9;
    --ink: #121212;
    --purple: #3B0558;
    --terracotta: #914937;
    --rule: rgba(18, 18, 18, 0.14);
    --muted: rgba(18, 18, 18, 0.56);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Spezia Wide", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    letter-spacing: 0.014em;
    line-height: 1.45;
    font-size: 15px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  a {
    color: var(--purple);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    text-decoration-color: rgba(59, 5, 88, 0.35);
    transition: color 120ms ease, text-decoration-color 120ms ease;
  }
  a:hover {
    color: var(--terracotta);
    text-decoration-color: rgba(145, 73, 55, 0.5);
  }

  /* ---- Poster grid ---- */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
    align-items: center;
    gap: clamp(32px, 5vw, 96px);
    width: 100%;
    max-width: 1360px;
    margin: 0 auto;
    padding: clamp(24px, 3.5vh, 48px) clamp(24px, 4vw, 72px) 16px;
  }

  /* ---- Left: content ---- */
  h1 {
    font-family: "Spezia Serif", Georgia, serif;
    font-weight: 500;
    font-size: var(--h1size);
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .bio {
    /* Body Copy per brand guidelines: Spezia Wide Medium,
       tracking 14 (0.014em), leading 140% */
    font-family: "Spezia Wide", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 0.92rem;
    letter-spacing: 0.014em;
    line-height: 1.4;
    margin-top: 16px;
    max-width: 26em;
    text-wrap: pretty;
  }

  .bio a {
    text-decoration-color: rgba(59, 5, 88, 0.28);
    white-space: nowrap;
  }

  /* Show only the input + button row of the Substack embed:
     the form row sits at the vertical center of the iframe, so a
     short overflow-hidden window cropped to the middle hides the
     title, subscriber count, and legal text around it. */
  .embed {
    position: relative;
    width: 360px;
    max-width: 100%;
    height: 60px;
    overflow: hidden;
    margin-top: 18px;
  }
  /* Substack centers a ~360px form inside the iframe; size the iframe
     wider and pull it left/up so only the form row shows, flush left. */
  .embed iframe {
    position: absolute;
    top: 50%;
    left: -52px;
    transform: translateY(-50%);
    width: 464px;
    height: 320px;
    border: 0;
  }

  /* ---- Right: etching plate ---- */
  .plate {
    align-self: center;
    text-align: center;
  }
  .plate img.etching {
    display: block;
    width: min(100%, calc(92vh * 1210 / 1600));
    height: auto;
    aspect-ratio: 1210 / 1600;
    margin: 0 auto;
    /* crop off the white plate mat baked into the PNG */
    clip-path: polygon(22.08% 3.09%, 77.92% 3.09%, 95.91% 16.22%, 95.91% 83.78%, 77.92% 96.91%, 22.08% 96.91%, 4.09% 83.78%, 4.09% 16.22%);
  }
  /* ---- Narrow screens ---- */
  @media (max-width: 900px) {
    body { font-size: 16px; height: 100dvh; }
    main {
      grid-template-columns: 1fr;
      /* etching gets all the height left over after the content */
      grid-template-rows: minmax(0, 1fr) auto;
      align-items: stretch;
      align-content: stretch;
      gap: 0;
      height: 100dvh;
      min-height: 0;
      padding-top: 12px;
      padding-bottom: 16px;
    }
    .plate {
      order: -1;
      padding: 0 0 6px;
      min-height: 0;
    }
    /* height is set precisely by the fit() script below */
    .plate img.etching {
      height: 40dvh;
      width: auto;
      max-width: 86vw;
      margin: 0 auto;
      object-fit: contain;
    }
    .content { text-align: center; }
    h1 { margin-top: 6px; }
    .bio { margin: 12px auto 0; text-align: left; }
    .embed { margin: 14px auto 0; }
  }
</style>
</head>
<body>
<main>
  <div class="content">
    <header>
      <h1>Jeremy Giffon</h1>
    </header>

    <div class="bio">
      <p>I invest in technology companies through my fund, <a href="https://octavecap.com">Octave</a>. You can learn more about me through my <a href="https://x.com/jeremygiffon">posts</a>, my <a href="https://www.linkedin.com/in/jeremygiffon/">resume</a> or interviews I&rsquo;ve done on podcasts like <a href="https://colossus.com/episode/giffon-special-situations-in-private-markets/">Invest Like The Best</a>. You can also subscribe to be notified of new writings.</p>
    </div>

    <div class="embed" aria-label="Subscribe to my Substack">
      <iframe src="https://jeremygiffon.substack.com/embed?r=1" title="Subscribe to Jeremy Giffon's newsletter" scrolling="no"></iframe>
    </div>
  </div>

  <aside class="plate" aria-hidden="true">
    <img class="etching" id="etching" alt="">
    <noscript><img class="etching" src="assets/etching-garden-1.png" alt=""></noscript>
  </aside>
</main>
<script>
  (function () {
    var etchings = ["cathedral-1", "cathedral-2", "cathedral-3", "garden-1", "garden-2", "garden-3"];
    var last = null;
    try { last = localStorage.getItem("etching"); } catch (e) {}
    var pool = etchings.filter(function (e) { return e !== last; });
    var pick = pool[Math.floor(Math.random() * pool.length)];
    try { localStorage.setItem("etching", pick); } catch (e) {}
    var img = document.getElementById("etching");
    img.src = "assets/etching-" + pick + ".png";

    // On mobile, give the etching every pixel left over after the content,
    // so the page fills one screen exactly with no scrolling.
    var main = document.querySelector("main");
    var content = document.querySelector(".content");
    function fit() {
      if (!window.matchMedia("(max-width: 900px)").matches) {
        img.style.height = "";
        return;
      }
      var ms = getComputedStyle(main);
      var avail = window.innerHeight
        - parseFloat(ms.paddingTop) - parseFloat(ms.paddingBottom)
        - content.offsetHeight - 6;
      img.style.height = Math.max(140, avail) + "px";
    }
    fit();
    window.addEventListener("resize", fit);
    window.addEventListener("load", fit);
  })();
</script>
</body>
</html>
